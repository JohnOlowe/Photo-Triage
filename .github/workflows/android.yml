name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Show test reports on failure
        if: always()
        run: |
          echo "=== TEST RESULTS ==="
          find app/build -type f | head -n 100 || true
          echo "--- test-results xml ---"
          cat app/build/test-results/testDebugUnitTest/*.xml 2>&1 | head -n 800 || true
          echo "--- reports html ---"
          cat app/build/reports/tests/testDebugUnitTest/classes/*.html 2>&1 | head -n 800 || true
          echo "--- gradle failure ---"
          cat app/build/reports/tests/testDebugUnitTest/index.html 2>&1 | head -n 300 || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: warn

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
