name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_test.log
          EXIT=${PIPESTATUS[0]}
          echo "Gradle exit code $EXIT"
          cat /tmp/gradle_test.log
          exit $EXIT

      - name: Post log as comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Posting log..."
          LOG=$(tail -n 300 /tmp/gradle_test.log | head -c 60000 | sed 's/`/\\`/g')
          # Escape for JSON via jq
          BODY=$(printf "Failure log for %s:\n\`\`\`\n%s\n\`\`\`" "${{ github.sha }}" "$LOG" | jq -Rs .)
          # Use gh api to post commit comment
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$BODY" || echo "failed to post comment"
          # Also create annotation
          echo "::error::$(head -n 50 /tmp/gradle_test.log | tr '\n' ' ')"

      - name: Show test reports on failure
        if: always()
        run: |
          echo "=== TEST RESULTS ==="
          find app/build -type f | head -n 200 || true
          echo "--- gradle log tail ---"
          tail -n 500 /tmp/gradle_test.log 2>&1 | head -n 800 || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            /tmp/gradle_test.log
            app/build/test-results/
            app/build/reports/
          if-no-files-found: warn

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
