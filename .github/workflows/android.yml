name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Post diagnostics on failure
        if: failure()
        run: |
          echo "::group::gradle_test.log tail"
          tail -n 500 /tmp/gradle_test.log 2>/dev/null || cat /tmp/gradle_test.log 2>/dev/null | tail -n 500 || echo "no log"
          echo "::endgroup::"
          echo "::group::gradle_test.log BUILD FAILED snippet"
          grep -n "BUILD FAILED\|FAILURE\|what went wrong\|What went wrong\|Execution failed\|error:" /tmp/gradle_test.log 2>/dev/null | head -n 50 || true
          grep -A30 "What went wrong" /tmp/gradle_test.log 2>/dev/null | head -n 80 || true
          echo "::endgroup::"
          echo "::group::junit xml"
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && echo "=== $f ===" && cat "$f" | head -c 8000; done || true
          echo "::endgroup::"
          echo "::group::test report html text"
          for f in app/build/reports/tests/testDebugUnitTest/classes/*.html; do [ -f "$f" ] && echo "=== $f ===" && sed 's/<[^>]*>/ /g' "$f" | tr -s ' ' | head -c 5000; done || true
          echo "::endgroup::"
          # emit annotations for each failed line
          echo "::error::CI failed — full logs in groups above; key snippet follows"
          grep -m 5 "FAILURE\|FAILED\|Assertion" /tmp/gradle_test.log 2>/dev/null | while IFS= read -r line; do echo "::error::$line"; done || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -m 10 "failure\|error" "$f" 2>/dev/null | while IFS= read -r line; do echo "::error::$f: $line"; done || true
          done

      - name: Annotate failure tail
        if: failure()
        run: |
          echo "::error::CI failed — see Post diagnostics groups for full logs"
          tail -n 120 /tmp/gradle_test.log 2>/dev/null | head -c 5000 | while IFS= read -r line; do echo "::error::$line"; done || true
