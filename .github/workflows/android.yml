name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Post diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Posting failure diagnostics via commit comment..."
          LOG=""
          if [ -f /tmp/gradle_test.log ]; then LOG="${LOG}\n==== gradle_test.log tail ====\n$(tail -n 300 /tmp/gradle_test.log)\n"; fi
          if [ -f /tmp/gradle_build.log ]; then LOG="${LOG}\n==== gradle_build.log tail ====\n$(tail -n 300 /tmp/gradle_build.log)\n"; fi
          if [ -f app/build/reports/tests/testDebugUnitTest/classes/damjay.photo.triage.ExampleUnitTest.html ]; then LOG="${LOG}\n==== test report ====\n$(cat app/build/reports/tests/testDebugUnitTest/classes/*.html 2>/dev/null | head -c 4000)\n"; fi
          # Also collect junit xml
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && LOG="${LOG}\n==== $f ====\n$(cat "$f" | head -c 4000)\n"
          done
          # Truncate to GH comment limit (65536)
          BODY=$(printf "CI failed for %s @ %s\n\`\`\`\n%s\n\`\`\`" "${{ github.sha }}" "${{ github.ref }}" "$LOG" | head -c 64000)
          # Post as commit comment (visible via api.github.com)
          echo "$BODY" | gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body=- --silent || echo "gh api comment failed"
          # Also emit ::error annotations (visible via check-runs API)
          echo "::error::CI failed — see commit comments for logs. Tail: $(tail -n 80 /tmp/gradle_test.log 2>/dev/null | tr '\n' ' ' | head -c 2000)"
