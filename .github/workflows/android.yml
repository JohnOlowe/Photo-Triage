name: Android CI

permissions:
  contents: write
  checks: write
  pull-requests: write
  issues: write

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Post diagnostics on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let body = `CI failed for ${context.sha} @ ${context.ref}\n`;
            try {
              const stat = fs.statSync('/tmp/gradle_test.log');
              body += `\n/tmp/gradle_test.log size ${stat.size} bytes\n`;
              const log = fs.readFileSync('/tmp/gradle_test.log', 'utf8');
              body += `\n==== HEAD 120 ====\n` + log.split('\n').slice(0,120).join('\n') + '\n';
              body += `\n==== TAIL 500 ====\n` + log.split('\n').slice(-500).join('\n') + '\n';
              body += `\n==== grep -i error (80) ====\n` + log.split('\n').filter(l=>/error/i.test(l)).slice(0,80).join('\n') + '\n';
              const wwIdx = log.indexOf('What went wrong');
              if (wwIdx>=0) body += `\n==== What went wrong block ====\n` + log.slice(wwIdx, wwIdx+4000) + '\n';
              const pdrIdx = log.indexOf('processDebugResources');
              if (pdrIdx>=0) body += `\n==== processDebugResources block ====\n` + log.slice(Math.max(0,pdrIdx-2000), pdrIdx+4000) + '\n';
            } catch(e) { body += `\n(gradle_test.log read error: ${e.message})\n`; }
            try {
              const bl = fs.readFileSync('/tmp/gradle_build.log','utf8');
              body += `\n==== gradle_build.log tail 300 ====\n` + bl.split('\n').slice(-300).join('\n') + '\n';
            } catch(e) {}
            try {
              const dir='app/build/test-results/testDebugUnitTest';
              if (fs.existsSync(dir)) {
                for (const f of fs.readdirSync(dir)) if (f.endsWith('.xml')) {
                  body += `\n==== ${f} ====\n` + fs.readFileSync(path.join(dir,f),'utf8').slice(0,6000) + '\n';
                }
              }
            } catch(e) {}
            body = body.slice(0,60000);
            core.info(body.slice(0,5000));
            // post as commit comment (now has permission)
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: '```\n' + body + '\n```'
              });
              core.info('posted commit comment');
            } catch(e) { core.warning('commit comment failed: ' + e.message); }
            // also emit as error for annotations
            for (const line of body.split('\n').slice(0,300)) {
              if (line.trim()) core.error(line);
            }
            core.setFailed('CI failed — see commit comment & annotations');

      - name: Annotate failure tail
        if: failure()
        run: |
          echo "::error::CI failed — see Post diagnostics groups for full logs"
          tail -n 120 /tmp/gradle_test.log 2>/dev/null | head -c 5000 | while IFS= read -r line; do echo "::error::$line"; done || true
