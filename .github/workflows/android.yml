name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Post diagnostics on failure
        if: failure()
        run: |
          echo "::error::CI failed — diagnostics dump follows (check annotations)"
          # Dump entire gradle_test.log as annotations in 40-line chunks (annotation message limit ~64k, but we chunk)
          if [ -f /tmp/gradle_test.log ]; then
            echo "::error::=== /tmp/gradle_test.log HEAD 200 ==="
            head -n 200 /tmp/gradle_test.log 2>/dev/null | while IFS= read -r line; do echo "::error::$line"; done || true
            echo "::error::=== /tmp/gradle_test.log TAIL 400 ==="
            tail -n 400 /tmp/gradle_test.log 2>/dev/null | while IFS= read -r line; do printf "::error::%s\n" "$line"; done || true
            echo "::error::=== grep -i error ==="
            grep -i -n "error" /tmp/gradle_test.log 2>/dev/null | head -n 80 | while IFS= read -r line; do echo "::error::$line"; done || true
            echo "::error::=== What went wrong block ==="
            grep -n "What went wrong" /tmp/gradle_test.log 2>/dev/null | head -n 5 | while IFS= read -r line; do echo "::error::$line"; done || true
            grep -A60 "What went wrong" /tmp/gradle_test.log 2>/dev/null | head -n 80 | while IFS= read -r line; do echo "::error::$line"; done || true
          else
            echo "::error::no /tmp/gradle_test.log"
          fi
          if [ -f /tmp/gradle_build.log ]; then
            echo "::error::=== /tmp/gradle_build.log tail ==="
            tail -n 200 /tmp/gradle_build.log 2>/dev/null | while IFS= read -r line; do echo "::error::$line"; done || true
          fi
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && echo "::error::=== $f ===" && cat "$f" 2>/dev/null | head -c 4000 | while IFS= read -r line; do echo "::error::$line"; done || true; done

      - name: Annotate failure tail
        if: failure()
        run: |
          echo "::error::CI failed — see Post diagnostics groups for full logs"
          tail -n 120 /tmp/gradle_test.log 2>/dev/null | head -c 5000 | while IFS= read -r line; do echo "::error::$line"; done || true
