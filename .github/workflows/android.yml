name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Post diagnostics on failure
        if: failure()
        run: |
          echo "::group::gradle_test.log tail"
          tail -n 600 /tmp/gradle_test.log 2>/dev/null || cat /tmp/gradle_test.log 2>/dev/null | tail -n 600 || echo "no log"
          echo "::endgroup::"
          echo "::group::gradle_test.log error snippet"
          grep -n "error:\|AAPT\|processDebugResources\|What went wrong\|Execution failed\|FAILED\|FAILURE" /tmp/gradle_test.log 2>/dev/null | head -n 120 || true
          echo "--- What went wrong block ---"
          grep -A80 "What went wrong" /tmp/gradle_test.log 2>/dev/null | head -n 120 || true
          echo "--- resource errors ---"
          grep -i "resource.*not found\|missing\|failed linking" /tmp/gradle_test.log 2>/dev/null | head -n 60 || true
          echo "::endgroup::"
          echo "::group::junit xml"
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && echo "=== $f ===" && cat "$f" | head -c 8000; done || true
          echo "::endgroup::"
          echo "::group::aapt intermediates"
          find app/build -name "*.txt" 2>/dev/null | head -20
          for f in app/build/intermediates/*/mergeDebugResources/*/aapt* 2>/dev/null; do echo "=== $f ==="; cat "$f" 2>/dev/null | head -n 100; done || true
          echo "::endgroup::"
          # emit annotations for key lines
          echo "::error::CI failed — check Post diagnostics groups for full logs"
          grep -n "error:\|AAPT error" /tmp/gradle_test.log 2>/dev/null | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done || true
          grep -A2 "What went wrong" /tmp/gradle_test.log 2>/dev/null | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -m 10 "failure\|error" "$f" 2>/dev/null | while IFS= read -r line; do echo "::error::$f: $line"; done || true
          done

      - name: Annotate failure tail
        if: failure()
        run: |
          echo "::error::CI failed — see Post diagnostics groups for full logs"
          tail -n 120 /tmp/gradle_test.log 2>/dev/null | head -c 5000 | while IFS= read -r line; do echo "::error::$line"; done || true
