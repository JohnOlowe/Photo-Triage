name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Post diagnostics on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let body = `CI failed for ${context.sha} @ ${context.ref}\n`;
            try {
              const log = fs.readFileSync('/tmp/gradle_test.log', 'utf8');
              // Find interesting section: BUILD FAILED, FAILED, Exception
              const lines = log.split('\n');
              const failIdx = lines.findIndex(l => l.includes('BUILD FAILED') || l.includes('FAILED') || l.includes('AssertionFailed'));
              const snippet = failIdx >= 0 ? lines.slice(Math.max(0, failIdx - 120), failIdx + 80).join('\n') : log.slice(-8000);
              body += '\n==== gradle_test.log snippet ====\n' + snippet + '\n';
            } catch(e) { body += '\n(no gradle_test.log: ' + e.message + ')\n'; }
            try {
              const buildLog = fs.readFileSync('/tmp/gradle_build.log', 'utf8');
              body += '\n==== gradle_build.log tail ====\n' + buildLog.slice(-4000) + '\n';
            } catch(e) {}
            // junit xml
            try {
              const dir = 'app/build/test-results/testDebugUnitTest';
              if (fs.existsSync(dir)) {
                for (const f of fs.readdirSync(dir)) {
                  if (f.endsWith('.xml')) {
                    const c = fs.readFileSync(path.join(dir, f), 'utf8');
                    body += `\n==== ${f} ====\n` + c.slice(0, 6000) + '\n';
                  }
                }
              }
            } catch(e) { body += '\n(junit read error: ' + e.message + ')\n'; }
            // also html report fragment
            try {
              const htmlDir = 'app/build/reports/tests/testDebugUnitTest/classes';
              if (fs.existsSync(htmlDir)) {
                for (const f of fs.readdirSync(htmlDir)) {
                  if (f.endsWith('.html')) {
                    const c = fs.readFileSync(path.join(htmlDir, f), 'utf8');
                    // strip tags crudely
                    const text = c.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 4000);
                    body += `\n==== ${f} text ====\n` + text + '\n';
                  }
                }
              }
            } catch(e) {}
            body = body.slice(0, 60000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '```\n' + body + '\n```'
            });
            core.setFailed('CI failed — diagnostics posted as commit comment');

      - name: Annotate failure tail
        if: failure()
        run: |
          echo "::error::CI failed — see commit comments for full logs"
          tail -n 120 /tmp/gradle_test.log 2>/dev/null | head -c 5000 | while IFS= read -r line; do echo "::error::$line"; done || true
